<style>

  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui, -apple-system, "Segoe UI", sans-serif; background:radial-gradient(900px 500px at 15% -10%, rgba(212,255,58,.12), transparent 60%), radial-gradient(900px 600px at 100% 110%, rgba(139,92,246,.18), transparent 60%), var(--bg); color:var(--text); min-height:100vh; }
  a { color:inherit; }
  .wrap { width:min(1180px, 100% - 32px); margin-inline:auto; padding:28px 0 60px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.2rem; text-decoration:none; }
  .logo i { width:40px; height:40px; border-radius:11px; background:var(--lime); color:var(--bg); display:grid; place-items:center; font-style:normal; font-weight:900; }
  h1 { font-size:clamp(1.9rem, 5vw, 3.2rem); line-height:1.05; letter-spacing:-.02em; }

  .sub { color:var(--muted); margin:12px 0 26px; max-width:640px; font-size:1.05rem; }

  video { display:block; width:100%; height:auto; aspect-ratio:16/9; background:#000; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; }
  .btn { display:inline-flex; align-items:center; gap:10px; padding:14px 22px; border-radius:999px; font-weight:700; text-decoration:none; }
  .btn-lime { background:var(--lime); color:var(--bg); }
  .btn-line { border:1px solid var(--line); background:rgba(255,255,255,.04); }
  .btn:focus-visible { outline:3px solid var(--violet); outline-offset:3px; }
  .chapters { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin-top:30px; }
  .chapters button { text-align:left; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:14px; padding:12px 14px; cursor:pointer; font:inherit; }
  .chapters button:hover, .chapters button:focus-visible { border-color:var(--lime); outline:none; }
  .chapters b { display:block; color:var(--lime); font-size:.8rem; }
  footer { color:var(--muted); font-size:.85rem; margin-top:36px; }
